name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: liblor-linux
          - os: windows-latest
            artifact_name: liblor-windows
          - os: macos-latest
            artifact_name: liblor-macos

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Build Single Header
      run: make single-header

    - name: Build Release Libraries
      run: make release

    - name: Prepare Artifacts
      shell: bash
      run: |
        mkdir -p release_artifacts
        cp lor.h LICENSE README.md release_artifacts/
        cp -R include release_artifacts/
        find .build/release -type f \
          \( -name '*.a' -o -name '*.so' -o -name '*.dylib' \
             -o -name '*.dll' -o -name '*.lib' \) \
          -exec cp {} release_artifacts/ \;

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: release_artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        cd all-artifacts
        for dir in liblor-*/; do
          if [ -d "$dir" ]; then
            zip -r "../release-assets/${dir%/}.zip" "$dir"
          fi
        done

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: release-assets/*.zip
        generate_release_notes: true
